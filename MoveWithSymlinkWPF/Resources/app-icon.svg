<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 主底板渐变：呼应软件 Fluent 品牌蓝 (#0078D4) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1492EB"/>
      <stop offset="50%" stop-color="#006CC8"/>
      <stop offset="100%" stop-color="#00386E"/>
    </linearGradient>

    <!-- 顶部柔和径向光晕 -->
    <radialGradient id="bgGlow" cx="26%" cy="18%" r="68%">
      <stop offset="0%" stop-color="#6AD7FF" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00386E" stop-opacity="0"/>
    </radialGradient>

    <!-- 底板内描边微高光 -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#001A38" stop-opacity="0.28"/>
    </linearGradient>

    <!-- 外圈磁盘扫描与空间释放弧（天青 -> 薄荷绿） -->
    <linearGradient id="scanArcGrad" x1="12%" y1="82%" x2="88%" y2="18%">
      <stop offset="0%" stop-color="#93E5FF" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- 柔和扫描雷达光幕 -->
    <linearGradient id="radarSweep" x1="50%" y1="50%" x2="90%" y2="14%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0.24"/>
    </linearGradient>

    <!-- 源目录虚影填充（提亮增重，平衡左右视觉重心） -->
    <linearGradient id="ghostFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.14"/>
    </linearGradient>

    <!-- 目标实体目录背板 -->
    <linearGradient id="folderBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#C96A04"/>
    </linearGradient>

    <!-- 目标实体目录前盖 -->
    <linearGradient id="folderFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE26A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EA8C00"/>
    </linearGradient>

    <!-- 前盖顶部高光 -->
    <linearGradient id="folderHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#FFFBEB" stop-opacity="0"/>
    </linearGradient>

    <!-- 符号链接徽章渐变 -->
    <linearGradient id="linkBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- 洁净清理 & AI 洞察星芒渐变 -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>

    <!-- 柔和投影滤镜 -->
    <filter id="softShadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#001A38" flood-opacity="0.34"/>
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#001A38" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- 1. 应用圆角方形底板 -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow)"/>
  <rect x="27" y="27" width="458" height="458" rx="105" fill="none" stroke="url(#rimGrad)" stroke-width="5"/>

  <!-- 2. 外扩加粗的磁盘扫描与空间释放环 -->
  <g>
    <!-- 柔和扇形扫描光幕 -->
    <path d="M 256 256 L 256 64 A 192 192 0 0 1 426 168 Z" fill="url(#radarSweep)"/>

    <!-- 底层存储容量圆环轨道 -->
    <circle cx="256" cy="256" r="192" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="22"/>

    <!-- 亮色扫描释放弧：r=192, 起点 152° (86, 346) 顺时针至 -26° (429, 172) -->
    <path d="M 86 346 A 192 192 0 0 1 427 169"
          fill="none"
          stroke="url(#scanArcGrad)"
          stroke-width="22"
          stroke-linecap="round"/>

    <!-- 沿切线对齐的加粗箭头（与右上星芒留出清晰间距） -->
    <path d="M 437 132 L 429 173 L 388 162"
          fill="none"
          stroke="#5EEAD4"
          stroke-width="20"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- 3. 放大并加粗的源目录虚影（48px/16px 通透有力） -->
  <g>
    <path d="M 130 134
             H 188
             C 196 134 203 138 209 146
             L 221 160
             H 286
             C 299 160 308 169 308 182
             V 264
             C 308 277 299 286 286 286
             H 130
             C 117 286 108 277 108 264
             V 156
             C 108 143 117 134 130 134 Z"
          fill="url(#ghostFill)"/>
    <path d="M 130 134
             H 188
             C 196 134 203 138 209 146
             L 221 160
             H 286
             C 299 160 308 169 308 182
             V 264
             C 308 277 299 286 286 286
             H 130
             C 117 286 108 277 108 264
             V 156
             C 108 143 117 134 130 134 Z"
          fill="none"
          stroke="#ECFAFF"
          stroke-width="13"
          stroke-dasharray="28 17"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- 4. 放大后的目标实体目录 -->
  <g filter="url(#softShadow)">
    <path d="M 224 222
             H 286
             C 295 222 302 226 308 234
             L 320 248
             H 396
             C 409 248 418 257 418 270
             V 362
             C 418 375 409 384 396 384
             H 224
             C 211 384 202 375 202 362
             V 244
             C 202 231 211 222 224 222 Z"
          fill="url(#folderBackGrad)"/>

    <!-- 露出的一页洁净文档细节 -->
    <rect x="220" y="254" width="180" height="38" rx="9" fill="#FFFDF5" opacity="0.94"/>

    <!-- 前盖 -->
    <path d="M 202 278
             C 202 267 211 260 222 260
             H 398
             C 409 260 418 267 418 278
             V 362
             C 418 375 408 384 396 384
             H 224
             C 212 384 202 375 202 362 Z"
          fill="url(#folderFrontGrad)"/>

    <!-- 前盖顶部柔和高光 -->
    <path d="M 222 262 H 398 C 407 262 415 268 416 278 V 289 H 204 V 278 C 205 268 213 262 222 262 Z"
          fill="url(#folderHighlight)"/>
  </g>

  <!-- 5. 左下角：克制白边的符号链接徽章 -->
  <g filter="url(#subtleShadow)">
    <circle cx="192" cy="342" r="52" fill="url(#linkBadgeGrad)" stroke="#FFFFFF" stroke-width="8"/>

    <g transform="translate(192, 342) rotate(-45)" fill="none" stroke="#FFFFFF" stroke-width="11.5" stroke-linecap="round">
      <path d="M -8 -13 H -17 C -27 -13 -34 -6 -34 0 C -34 6 -27 13 -17 13 H -8"/>
      <path d="M 8 -13 H 17 C 27 -13 34 -6 34 0 C 34 6 27 13 17 13 H 8"/>
      <line x1="-14" y1="0" x2="14" y2="0"/>
    </g>
  </g>

  <!-- 6. 右上角：单颗干脆利落的四角星芒（与下方箭头清晰留白） -->
  <g filter="url(#subtleShadow)">
    <path d="M 426 54
             Q 426 83 455 83
             Q 426 83 426 112
             Q 426 83 397 83
             Q 426 83 426 54 Z"
          fill="url(#sparkleGrad)"/>
  </g>
</svg>
